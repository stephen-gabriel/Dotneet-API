# Render.com deployment configuration for Dotneet API
# https://render.com/docs/services/web

services:
  - type: web
    name: dotneet-api
    env: node
    rootDir: .
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://dotneet.vercel.app,http://localhost:3000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 600
      - key: LOG_LEVEL
        value: info